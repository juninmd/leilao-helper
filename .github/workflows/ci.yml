name: CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint:ext
      - name: E2E (extension in Chromium)
        run: |
          # Só o navegador: as libs de sistema já vêm na imagem do runner, e o --with-deps travava no apt
          # (falha de DNS em archive.ubuntu.com ao baixar fontes opcionais).
          npx playwright install chromium
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx playwright test
