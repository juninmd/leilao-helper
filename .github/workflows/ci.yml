name: CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint:ext
      - name: E2E (extension in Chromium)
        run: |
          # Instala o Chromium com as libs de sistema; se o apt travar (já houve falha de DNS em archive.ubuntu.com),
          # cai para só o navegador, já que a imagem do runner traz as libs necessárias.
          timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx playwright test
